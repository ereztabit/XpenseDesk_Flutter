<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Add Payment Card — XpenseDesk</title>
  <script>
    var l = document.createElement('link');
    l.rel  = 'stylesheet';
    l.href = 'authorize.css?v=' + Date.now();
    document.head.appendChild(l);
  </script>
  <script src="https://hf.tranzila.com/assets/js/thostedf.js"></script>
  <script>
    var s = document.createElement('script');
    s.src = 'authorize.js?v=' + Date.now();
    document.head.appendChild(s);
  </script>
</head>
<body>
  <header>
    <img class="logo-img" src="xpensedesk-main-logo-trans.png" alt="XpenseDesk" />
    <div class="header-right">
      <!-- PCI DSS Compliant badge (inline SVG, no external dependency) -->
      <svg xmlns="http://www.w3.org/2000/svg" width="72" height="28" viewBox="0 0 72 28" aria-label="PCI DSS Compliant">
        <rect width="72" height="28" rx="4" fill="#1e3a5f"/>
        <text x="36" y="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">PCI DSS</text>
        <text x="36" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="6" fill="#93c5fd" text-anchor="middle" dominant-baseline="middle">COMPLIANT</text>
      </svg>
    </div>
  </header>
  <main>
    <div class="card">
      <h2 id="page-title">Add Payment Card</h2>

      <div id="status-banner" class="banner"></div>

      <div class="field-group">
        <label id="label-card-number">Card Number</label>
        <div id="card-number"></div>
        <div id="errors_for_credit_card_number" class="field-error"></div>
      </div>

      <div class="row">
        <div class="field-group">
          <label id="label-cvv">CVV</label>
          <div id="cvv"></div>
          <div id="errors_for_cvv" class="field-error"></div>
        </div>
        <div class="field-group">
          <label id="label-expiry">Expiry</label>
          <div id="expiry"></div>
          <div id="errors_for_expiry" class="field-error"></div>
        </div>
      </div>

      <button id="submit-btn" disabled>Save Card</button>

      <div id="result"></div>
    </div>
  </main>

  <footer id="footer-powered-by">Powered by Tranzila</footer>

</body>
</html>
