<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="AI-powered expense approval for small businesses.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#362B71">

  <!--
    Google Analytics (GA4) — gtag.js, prod-only.
    The gtag() queue stub + dataLayer are always defined and exposed on window so
    Dart (lib/services/analytics_service.dart) can call window.gtag unconditionally.
    Off-prod nothing drains the queue (no gtag.js loads), so events silently no-op
    and the network request to googletagmanager is never made. On the production
    host the real gtag.js loads and config runs, sending queued + live events.
  -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    window.gtag = gtag;
    if (window.location.hostname === 'app.xpensedesk.com') {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-C0F5GTGNZD';
      document.head.appendChild(s);
      gtag('js', new Date());
      gtag('config', 'G-C0F5GTGNZD');
    }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="XpenseDesk">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <!-- Google Fonts - Assistant -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">

  <title>XpenseDesk</title>
  <link rel="manifest" href="manifest.json">

  <!--
    PWA install plumbing (Chromium: Android Chrome/Edge, desktop Chrome/Edge).
    Capture beforeinstallprompt early — it can fire before Flutter boots — stash
    it, and expose state to Dart via a <html> data attribute + custom events.
    Dart triggers the native dialog by dispatching 'pwa-install-trigger'.
    iOS/Safari never fires this; that path uses the manual "Add to Home Screen" flow.
  -->
  <script>
    (function () {
      var deferred = null;
      var root = document.documentElement;
      function setInstallable(v) {
        root.setAttribute('data-pwa-installable', v ? '1' : '0');
      }
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();          // suppress Chrome's one-shot mini-infobar
        deferred = e;
        setInstallable(true);
        window.dispatchEvent(new CustomEvent('pwa-install-available'));
      });
      window.addEventListener('pwa-install-trigger', function () {
        if (!deferred) return;
        deferred.prompt();           // must run inside a user gesture
        deferred.userChoice.then(function () {
          deferred = null;           // consumed; re-fires on next load if not installed
          setInstallable(false);
          window.dispatchEvent(new CustomEvent('pwa-install-consumed'));
        });
      });
      window.addEventListener('appinstalled', function () {
        deferred = null;
        setInstallable(false);
        window.dispatchEvent(new CustomEvent('pwa-install-consumed'));
      });
    })();
  </script>

  <style>
    #flutter-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
    }

    #flutter-loader .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #EBE8F2;
      border-top-color: #362B71;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!--
    Microsoft sign-in (MSAL.js). msal-browser.min.js is the official
    @azure/msal-browser bundle; msal_interop.js exposes window.xdMsal to Dart.
    `defer` keeps document order (library before glue) and runs them before
    interactivity; the actual sign-in only fires on a user tap, long after load.
  -->
  <script src="msal-browser.min.js" defer></script>
  <script src="msal_interop.js" defer></script>

  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="flutter-loader">
    <div class="spinner"></div>
  </div>

  <!--
    Sandboxed / opaque-origin notice. Shown when the app is opened inside a
    context that lacks the sandbox `allow-same-origin` flag (e.g. a magic link
    opened in an email client's in-app browser). There, same-origin storage
    (localStorage/IndexedDB) throws and secure sign-in cannot complete, so we do
    NOT boot Flutter — we tell the user to open the link in a real browser.
    Strings are bilingual and hardcoded because this shell runs before Flutter
    (and thus before AppLocalizations) is available.
  -->
  <div id="sandbox-notice" style="display:none; position:fixed; inset:0; flex-direction:column; align-items:center; justify-content:center; background:#ffffff; z-index:10000; padding:24px; text-align:center; font-family:'Assistant','Segoe UI',Arial,sans-serif; color:#1a1a2e;">
    <div style="max-width:460px;">
      <div style="font-size:44px; margin-bottom:16px;">&#128274;</div>
      <h1 style="font-size:20px; font-weight:700; margin:0 0 12px;">Please open this link in your browser</h1>
      <p style="font-size:15px; line-height:1.6; color:#555; margin:0 0 18px;">
        This sign-in link was opened inside an in-app preview that blocks secure login.
        Copy the address below and open it in Chrome, Safari, or Edge.
      </p>
      <div dir="rtl" style="font-size:15px; line-height:1.6; color:#555; margin:0 0 20px;">
        &#1497;&#1513; &#1500;&#1508;&#1514;&#1493;&#1495; &#1511;&#1497;&#1513;&#1493;&#1512; &#1494;&#1492; &#1489;&#1491;&#1508;&#1491;&#1508;&#1503; (Chrome, Safari &#1488;&#1493; Edge). &#1492;&#1511;&#1497;&#1513;&#1493;&#1512; &#1504;&#1508;&#1514;&#1495; &#1489;&#1514;&#1510;&#1493;&#1490;&#1492; &#1502;&#1493;&#1496;&#1502;&#1506;&#1514; &#1513;&#1495;&#1493;&#1505;&#1502;&#1514; &#1492;&#1514;&#1495;&#1489;&#1512;&#1493;&#1514; &#1502;&#1488;&#1493;&#1489;&#1496;&#1495;&#1514;.
      </div>
      <div id="sandbox-url" style="direction:ltr; word-break:break-all; background:#f3f2f8; border:1px solid #e0dcec; border-radius:8px; padding:12px; font-size:13px; color:#362B71; user-select:all; -webkit-user-select:all;"></div>
    </div>
  </div>

  <script>
    (function () {
      // Microsoft sign-in uses the REDIRECT flow: the whole tab navigates to
      // Microsoft and returns to /auth/microsoft-callback in the SAME tab. That
      // path boots the app normally — msal_interop.js (loaded in <head>) processes
      // the response via handleRedirectPromise() and MicrosoftCallbackScreen reads
      // the resulting token. So there is no special-casing here; just boot Flutter.

      // Detect a sandboxed / opaque-origin context. Both signals are true only
      // in an opaque origin; a normal https top-level document passes both.
      function isOpaqueOrigin() {
        try {
          if (self.origin === 'null' || document.origin === 'null') return true;
        } catch (e) {
          return true;
        }
        try {
          window.localStorage.getItem('__xd_probe__');
        } catch (e) {
          return true;
        }
        return false;
      }

      if (isOpaqueOrigin()) {
        var loader = document.getElementById('flutter-loader');
        if (loader) loader.style.display = 'none';
        var notice = document.getElementById('sandbox-notice');
        notice.style.display = 'flex';
        try {
          document.getElementById('sandbox-url').textContent = window.location.href;
        } catch (e) { /* location is always readable, but stay defensive */ }
        return; // do not boot Flutter — storage/network are unusable here
      }

      // Not sandboxed — boot Flutter normally.
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js';
      s.async = true;
      document.body.appendChild(s);
    })();

    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('flutter-loader');
      if (loader) loader.remove();
    });
  </script>
</body>
</html>
