<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="AI-powered expense approval for small businesses.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#362B71">

  <!--
    Google Analytics (GA4) — gtag.js, prod-only.
    The gtag() queue stub + dataLayer are always defined and exposed on window so
    Dart (lib/services/analytics_service.dart) can call window.gtag unconditionally.
    Off-prod nothing drains the queue (no gtag.js loads), so events silently no-op
    and the network request to googletagmanager is never made. On the production
    host the real gtag.js loads and config runs, sending queued + live events.
  -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    window.gtag = gtag;
    if (window.location.hostname === 'app.xpensedesk.com') {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-C0F5GTGNZD';
      document.head.appendChild(s);
      gtag('js', new Date());
      gtag('config', 'G-C0F5GTGNZD');
    }
  </script>

  <!--
    Microsoft Clarity — prod-only (session recordings + heatmaps).
    Gated to the production host so dev/local sessions are never recorded; off-prod
    the loader never runs and no request to clarity.ms is made.
  -->
  <script type="text/javascript">
    if (window.location.hostname === 'app.xpensedesk.com') {
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "xdmbg56m1b");
    }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="XpenseDesk">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <!-- Google Fonts - Assistant -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">

  <title>XpenseDesk</title>
  <link rel="manifest" href="manifest.json">

  <!--
    PWA install plumbing (Chromium: Android Chrome/Edge, desktop Chrome/Edge).
    Capture beforeinstallprompt early — it can fire before Flutter boots — stash
    it, and expose state to Dart via a <html> data attribute + custom events.
    Dart triggers the native dialog by dispatching 'pwa-install-trigger'.
    iOS/Safari never fires this; that path uses the manual "Add to Home Screen" flow.
  -->
  <script>
    (function () {
      var deferred = null;
      var root = document.documentElement;
      function setInstallable(v) {
        root.setAttribute('data-pwa-installable', v ? '1' : '0');
      }
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();          // suppress Chrome's one-shot mini-infobar
        deferred = e;
        setInstallable(true);
        window.dispatchEvent(new CustomEvent('pwa-install-available'));
      });
      window.addEventListener('pwa-install-trigger', function () {
        if (!deferred) return;
        deferred.prompt();           // must run inside a user gesture
        deferred.userChoice.then(function () {
          deferred = null;           // consumed; re-fires on next load if not installed
          setInstallable(false);
          window.dispatchEvent(new CustomEvent('pwa-install-consumed'));
        });
      });
      window.addEventListener('appinstalled', function () {
        deferred = null;
        setInstallable(false);
        window.dispatchEvent(new CustomEvent('pwa-install-consumed'));
      });
    })();
  </script>

  <style>
    #flutter-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
    }

    #flutter-loader .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #EBE8F2;
      border-top-color: #362B71;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="flutter-loader">
    <div class="spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('flutter-loader');
      if (loader) loader.remove();
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
