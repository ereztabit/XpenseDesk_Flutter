api:
  isBackendOnSameMachine: false
  baseUrl: https://127.0.0.1:7223

app:
  name: XpenseDesk Dev
  environment: development

payment:
  tranzilaTerminal: dev123
  use3ds: false

trial:
  # Length of the free trial in days, shown in the plan-selection copy.
  # The authoritative trial end date still comes from the backend.
  trialDays: 30

features:
  # Show the "Sign in with Microsoft" button and process its redirect on return.
  enableMicrosoftLogin: true
  # Emit [xdMsal] diagnostic logs to the browser console (debugging aid).
  enableMicrosoftLoginLogs: true
  # Show "Subscribe with Microsoft" on onboarding step 1 (no-OTP SSO onboarding).
  enableMicrosoftOnboarding: true
